# Blueprint do Render só para o serviço de reconstrução 3D (Python/Docker).
# O site (Node) continua configurado pelo painel e não é tocado por este arquivo.
# Criar: Render > New > Blueprint > este repositório, branch Detalhes_Finais.
services:
  - type: web
    name: mercado-local-reconstrucao-3d
    runtime: docker
    plan: free
    branch: Detalhes_Finais
    dockerfilePath: ./reconstrucao-3d/Dockerfile
    dockerContext: .
    healthCheckPath: /saude
    # Só refaz a imagem quando muda algo da reconstrução (ou o visualizador do site)
    buildFilter:
      paths:
        - reconstrucao-3d/**
        - ar-viewer.js
    # Entrada pelo login do site: o botão "Escanear com a câmera" do painel manda
    # o token do Firebase e o serviço confere com as chaves públicas do Google.
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: fatecoin-mercado  # não é segredo (vai dentro de todo token)
      - key: SEGREDO_SESSAO
        generateValue: true      # assina o cookie do serviço; não precisa copiar
      - key: INTERVALO_MALHA
        value: "3"               # plano grátis (0,1 CPU): prévia a cada 3 s
