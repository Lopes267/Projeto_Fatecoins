<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captura 3D</title>
<style>
  :root{--bg:#0d0d0d;--card:#161616;--borda:#2a2a2a;--texto:#f0ece3;--fraco:#9a9a9a;--acento:#e8854a;--ok:#5bbf7a;--ruim:#e0605a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 12px;color:var(--fraco)}
  .cartao{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin:16px 0}
  label{display:block;font-size:14px;color:var(--fraco);margin-bottom:6px}
  select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--borda);background:#1f1f1f;color:var(--texto);font:inherit}
  button{width:100%;padding:14px;border-radius:12px;border:0;font:600 17px system-ui,sans-serif;cursor:pointer}
  .pri{background:var(--acento);color:#1a0f08}
  .pri:disabled{opacity:.45}
  .sec{background:#262626;color:var(--texto)}
  #verificacao li{margin:4px 0}
  .ok{color:var(--ok)} .ruim{color:var(--ruim)}
  #erro{display:none;background:#2a1414;border:1px solid #5a2a2a;color:#f3c1bd;border-radius:12px;padding:12px;margin-top:12px}
  #resultado{display:none}

  /* Sobreposição durante a captura (dom-overlay do WebXR) */
  #sobreposicao{display:none;position:fixed;inset:0;pointer-events:none;color:#fff}
  #sobreposicao .topo{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
       background:linear-gradient(#000a,#0000);font-size:15px}
  #sobreposicao .mira{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
       border:2px solid #fffc;border-radius:50%;box-shadow:0 0 0 2px #0006}
  #sobreposicao .base{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);
       background:linear-gradient(#0000,#000b);pointer-events:auto;display:flex;gap:10px}
  #sobreposicao .base button{flex:1}
  #numeros{font-variant-numeric:tabular-nums;opacity:.85;font-size:13px}
</style>
</head>
<body>
<main id="inicio">
  <h1>Captura 3D</h1>
  <p>Aponte para o objeto, toque em Começar e dê uma volta devagar ao redor dele, a uns 40 cm.
     O modelo aparece no computador enquanto você anda.</p>
  <div class="cartao">
    <ul id="verificacao" style="padding-left:18px;margin:0"><li>Verificando o aparelho…</li></ul>
  </div>
  <div class="cartao">
    <label for="tamanho">Tamanho do objeto</label>
    <select id="tamanho">
      <option value="0.15">Pequeno (até 15 cm) — caneca, tênis</option>
      <option value="0.25" selected>Médio (até 30 cm) — vaso, caixa</option>
      <option value="0.45">Grande (até 60 cm) — cadeira</option>
    </select>
  </div>
  <button id="comecar" class="pri" disabled>Começar</button>
  <div id="erro"></div>
  <div id="resultado" class="cartao"></div>
</main>

<div id="sobreposicao">
  <div class="topo"><div id="status">Iniciando…</div><div id="numeros"></div></div>
  <div class="mira"></div>
  <div class="base">
    <button id="cancelar" class="sec">Cancelar</button>
    <button id="finalizar" class="pri">Finalizar</button>
  </div>
</div>
<script src="/web/captura.js"></script>
</body>
</html>
