<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<style>body{margin:0;background:#111;color:#ddd;font:12px monospace}
#out{padding:12px;white-space:pre-wrap}#tiras{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
canvas{width:150px;image-rendering:pixelated;border:1px solid #333}</style>
</head><body><div id="out">rodando…</div><div id="tiras"></div>
<script src="../scanner-3d.js"></script>
<script>
const out=document.getElementById('out'), tiras=document.getElementById('tiras');
const log=m=>{out.textContent+='\n'+m;};
window.onerror=e=>log('ERRO '+e);
out.textContent='SEGMENTACAO — cenas sinteticas com verdade conhecida';

const C=Scanner3D._consts, LARG=C.LARG, ALT=C.ALT;
const ROI={x0:Math.round(0.16*LARG),y0:Math.round(0.25*ALT),x1:Math.round(0.84*LARG),y1:Math.round(0.75*ALT)};

let semente=12345;
function rnd(){semente=(semente*1103515245+12345)&0x7fffffff;return semente/0x7fffffff;}

function cena(desenhar){
  const cv=document.createElement('canvas'); cv.width=LARG; cv.height=ALT;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  desenhar(ctx);
  const d=ctx.getImageData(0,0,LARG,ALT);
  const px=d.data;
  for(let i=0;i<px.length;i+=4){          // ruido de sensor
    const n=(rnd()-0.5)*7;
    px[i]=Math.max(0,Math.min(255,px[i]+n));
    px[i+1]=Math.max(0,Math.min(255,px[i+1]+n));
    px[i+2]=Math.max(0,Math.min(255,px[i+2]+n));
  }
  return {cv:cv,ctx:ctx,px:px};
}

function mostrar(nome,c,r){
  const cv=document.createElement('canvas'); cv.width=LARG; cv.height=ALT;
  const g=cv.getContext('2d'); g.drawImage(c.cv,0,0);
  const d=g.getImageData(0,0,LARG,ALT), p=d.data;
  for(let i=0;i<LARG*ALT;i++) if(r.mascara[i]){p[i*4]=255;p[i*4+1]=0;p[i*4+2]=180;}
  g.putImageData(d,0,0);
  g.strokeStyle='#0f0'; g.strokeRect(ROI.x0,ROI.y0,ROI.x1-ROI.x0,ROI.y1-ROI.y0);
  const cx=document.createElement('div'); cx.style.textAlign='center';
  cx.appendChild(cv); const t=document.createElement('div'); t.textContent=nome; cx.appendChild(t);
  tiras.appendChild(cx);
}

function caixaDaMascara(m){
  let x0=1e9,y0=1e9,x1=-1,y1=-1,a=0;
  for(let y=0;y<ALT;y++)for(let x=0;x<LARG;x++) if(m[y*LARG+x]){
    a++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;}
  return a?{x0,y0,x1,y1,a}:null;
}

function caso(nome,verdade,desenhar,espera){
  const c=cena(desenhar);
  const t0=performance.now();
  for(let k=0;k<5;k++) Scanner3D._segmentar(c.px);
  const ms=((performance.now()-t0)/5).toFixed(1);
  const r=Scanner3D._segmentar(c.px);
  const av=Scanner3D._avaliarCena(r);
  const cx=caixaDaMascara(r.mascara);
  mostrar(nome,c,r);
  let linha=nome.padEnd(28);
  if(espera){
    const bate=(av.instrucao||'').indexOf(espera)>=0;
    linha+='instrucao esperada "'+espera+'"'+(bate?'   OK':'   <<< FALHA');
    log(linha);
    log('    '+av.itens.map(i=>(i.ok?'v ':'x ')+i.rotulo).join(' | '));
    log('    instrucao: '+(av.instrucao||'(pronto)')+'   '+ms+' ms/quadro');
    return r;
  }
  if(!cx){ linha+='NADA ENCONTRADO'; }
  else if(!verdade){ linha+='achou area='+cx.a+' (esperado: nada)'; }
  else{
    const areaV=(verdade.x1-verdade.x0)*(verdade.y1-verdade.y0);
    const cobre=[];
    // fracao da verdade que a mascara cobre
    let dentro=0;
    for(let y=verdade.y0;y<verdade.y1;y++)for(let x=verdade.x0;x<verdade.x1;x++)
      if(r.mascara[y*LARG+x]) dentro++;
    const rec=dentro/areaV, prec=dentro/cx.a;
    linha+='cobre '+(rec*100).toFixed(0)+'% do produto, '+(prec*100).toFixed(0)+'% da mascara e produto';
    linha+=(rec>0.85&&prec>0.80)?'   OK':'   <<< FALHA';
  }
  log(linha);
  log('    '+av.itens.map(i=>(i.ok?'v ':'x ')+i.rotulo).join(' | '));
  log('    instrucao: '+(av.instrucao||'(pronto)')+'   pronto='+av.pronto+'   '+ms+' ms/quadro');
  return r;
}

function texto(ctx,cor,x,y,w,linhas){
  ctx.fillStyle=cor;
  for(let i=0;i<linhas;i++) ctx.fillRect(x, y+i*14, w*(0.5+0.5*((i*37)%10)/10), 6);
}

// 1. caderno claro sobre mesa branca — o caso que o lojista relatou
caso('caderno claro/mesa branca',{x0:100,y0:150,x1:285,y1:360},ctx=>{
  ctx.fillStyle='#f2f0ec'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#d6d3ca'; ctx.fillRect(100,150,185,210);
  texto(ctx,'#232328',120,190,140,8);
});

// 2. caderno azul sobre mesa de madeira — caso facil
caso('caderno azul/mesa madeira',{x0:100,y0:150,x1:285,y1:360},ctx=>{
  ctx.fillStyle='#b0834f'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#264a8c'; ctx.fillRect(100,150,185,210);
  texto(ctx,'#ffffff',120,190,140,8);
});

// 3. caixa bege sobre mesa de madeira clara — cores vizinhas
caso('caixa bege/mesa clara',{x0:110,y0:160,x1:275,y1:350},ctx=>{
  ctx.fillStyle='#cbb391'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#a89173'; ctx.fillRect(110,160,165,190);
  texto(ctx,'#5b4a33',130,200,120,5);
});

// 4. produto largo — testa a regra de distancia
caso('produto largo',{x0:82,y0:200,x1:302,y1:320},ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#d94f3d'; ctx.fillRect(82,200,220,120);
});

// 5. produto alto e estreito
caso('produto alto/estreito',{x0:160,y0:140,x1:225,y1:375},ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#4fb36a'; ctx.fillRect(160,140,65,235);
});

// 6. produto pequeno demais (longe)
caso('produto longe',{x0:170,y0:230,x1:215,y1:290},ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#4f7fb3'; ctx.fillRect(170,230,45,60);
});

// 7. mesa vazia — nao pode achar nada
caso('mesa vazia',null,ctx=>{
  ctx.fillStyle='#f2f0ec'; ctx.fillRect(0,0,LARG,ALT);
},'Não achei');

// 8. produto com sombra que toca a borda da moldura
caso('produto com sombra longa',{x0:120,y0:160,x1:265,y1:350},ctx=>{
  ctx.fillStyle='#e8e4dc'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#c9c4ba'; ctx.fillRect(120,340,220,26);   // sombra ate perto da borda
  ctx.fillStyle='#7a5230'; ctx.fillRect(120,160,145,190);
});

// 9. produto comprido deitado — o caso que travava: enche a largura
//    mas nunca chegaria a 45% da altura
caso('produto comprido 3:1',{x0:80,y0:215,x1:305,y1:290},ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#e0b93f'; ctx.fillRect(80,215,225,75);
});

// 9b. mesmo produto enchendo a moldura — nao cabe no volume ao girar
caso('produto sem folga',null,ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#e0b93f'; ctx.fillRect(64,215,256,75);
},'Afaste');

// 10. produto perto demais — tem de mandar afastar
caso('produto perto demais',null,ctx=>{
  ctx.fillStyle='#2b2b30'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#8f5fd0'; ctx.fillRect(40,100,305,310);
},'Afaste');

// 11. garrafa de duas cores — miolo tem o rotulo, tampa é outra cor
caso('garrafa rotulo+tampa',{x0:150,y0:150,x1:235,y1:365},ctx=>{
  ctx.fillStyle='#eae6de'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#1f7a4d'; ctx.fillRect(150,150,85,45);      // tampa verde
  ctx.fillStyle='#c9302c'; ctx.fillRect(150,195,85,120);     // rotulo vermelho
  ctx.fillStyle='#3a3f4a'; ctx.fillRect(150,315,85,50);      // base escura
});

// 12. caderno branco sobre mesa branca — indistinguivel de proposito
caso('caderno branco/mesa branca',null,ctx=>{
  ctx.fillStyle='#f4f2ee'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#f7f5f1'; ctx.fillRect(110,160,165,190);
},'Não achei');

// 13. caixa com logo escuro tomando todo o miolo da moldura — a
//     semente do produto cai inteira em cima do logo
caso('caixa com logo no miolo',{x0:110,y0:150,x1:275,y1:360},ctx=>{
  ctx.fillStyle='#efece6'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#8fbf6a'; ctx.fillRect(110,150,165,210);
  ctx.fillStyle='#20242c'; ctx.fillRect(138,200,110,110);
});

// 14. produto encostado num objeto qualquer da mesa (nao pode grudar)
caso('produto ao lado de outro',{x0:130,y0:170,x1:250,y1:350},ctx=>{
  ctx.fillStyle='#e6e2da'; ctx.fillRect(0,0,LARG,ALT);
  ctx.fillStyle='#c0392b'; ctx.fillRect(130,170,120,180);
  ctx.fillStyle='#2980b9'; ctx.fillRect(262,200,40,120);
});

log('\nfim');

</script></body></html>
